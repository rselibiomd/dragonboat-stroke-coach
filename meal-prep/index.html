function load(){try{const old=JSON.parse(localStorage.getItem(F)||'{}');return {...initial,...old,checked:old.checked||{},notes:old.notes||{}}}catch(e){return {...initial}}}
function save(){try{localStorage.setItem(F,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function ce(s){return esc(s)}
function setPage(page){state.page=page;save();render();window.scrollTo({top:0,behavior:'smooth'});document.getElementById('navwrap').classList.remove('open');document.getElementById('mobileMenu').setAttribute('aria-expanded','false')}
function setWeek(w){state.week=((w%4)+4)%4;save();render()}
function currentWeek(){return weeks[state.week]}
function checkKey(section,i){return section+'-'+state.week+'-'+i}
function check(section,i){return !!state.checked[checkKey(section,i)]}
function toggleCheck(section,i){const k=checkKey(section,i);state.checked[k]=!state.checked[k];save();render()}
function completed(section,n){let x=0;for(let i=0;i<n;i++)if(check(section,i))x++;return x}
function progress(done,total){return `<div class="progress" aria-label="${done} out of ${total} completed"><i style="width:${Math.round((done/Math.max(1,total))*100)}%"></i></div>`}
function weekSelect(){return `<div class="week-pills no-print">${weeks.map((w,i)=>`<button data-week="${i}" class="pill ${i===state.week?'active':''}" aria-pressed="${i===state.week}">Week ${i+1}</button>`).join('')}</div>`}
function weekFeature(){const w=currentWeek();return `<div class="week-feature"><div><div class="smallcap">Week ${state.week+1} of 4</div><h2>${w.title}</h2><p>${w.flavour} · ${w.proteins}</p></div><span class="badge">For two adults</span></div>`}
function heading(title,sub){return `<div class="page-intro"><div class="smallcap">THE SELIBIO TABLE</div><h1>${title}</h1><p>${sub}</p></div>`}

 <div class="grid cols-3"><div class="card"><div class="smallcap">Dry rice</div><h3>1½ cups</h3><p>White, brown or a blend.</p></div><div class="card"><div class="smallcap">Dry quinoa</div><h3>¾ cup</h3><p>Rinse and cook separately.</p></div><div class="card"><div class="smallcap">Dry lentils</div><h3>¾ cup</h3><p>Green or brown; retain texture.</p></div></div>
 <p class="notice" style="margin-top:15px">This yields roughly 10–12 moderate grain side servings, depending on final cooked yield and your preferred portion. Add shelled edamame at serving, not to the entire batch. Freeze later-week rice portions promptly after cooling.</p>`}
function prep(){const arr=currentWeek().prep;const fixed=['Check fridge/freezer and clear counter space','Cook rice, quinoa and lentils separately; spread into shallow containers to cool promptly','Portion and label raw marinated freezer packs; freeze immediately','Wash, dry and store fresh cucumbers, tomatoes, peppers and greens','Prepare two breakfasts and two clean sauces','Pack early-week portions; freeze later-week cooked rice and meals promptly','Set phone reminder to move frozen dinner protein to the fridge before use'];const tasks=[...arr,...fixed];const count=completed('prep',tasks.length);return `${heading('Your Sunday prep plan','Prepare the building blocks, not the entire week of cooked meals. Tick off the week-specific tasks and the repeatable essentials.')}${weekSelect()}${weekFeature()}<div class="card" style="margin-top:17px"><div class="flexrow"><div><strong>Sunday checklist</strong><p class="muted" style="font-size:12px;margin:2px 0">${count} of ${tasks.length} complete</p></div><div class="toolrow"><button class="btn btn-outline" data-action="reset-prep">↻ Reset week</button></div></div><div style="margin:10px 0 15px">${progress(count,tasks.length)}</div><div class="step-list">${tasks.map((x,i)=>`<label class="step ${check('prep',i)?'complete':''}"><input type="checkbox" class="step-check" data-check="prep" data-index="${i}" ${check('prep',i)?'checked':''}><div class="step-text">${esc(x)}</div></label>`).join('')}</div></div>
 ${sectionhead('Sunday timeline','Work in parallel; the number of cooked dishes determines the time.')}
 <div class="grid cols-2"><div class="card"><div class="smallcap">00:00–00:20</div><h3>Start grains + set up</h3><p>Put rice, lentils and quinoa on. Label raw-protein bags before handling meat.</p></div><div class="card"><div class="smallcap">00:20–00:45</div><h3>Marinate + freeze</h3><p>Build distinct packs with separate clean containers or utensils. Freeze later-week raw portions immediately.</p></div><div class="card"><div class="smallcap">00:45–01:15</div><h3>Week-specific cooking</h3><p>Cook meatballs, curry or another freezer-friendly component only if planned. Wash fresh vegetables while food cooks.</p></div><div class="card"><div class="smallcap">01:15–02:00</div><h3>Cool, pack + reset</h3><p>Prepare oat jars and sauces; cool grains rapidly, portion and freeze later-week servings; wash all equipment.</p></div></div>
 <div class="callout gold" style="margin-top:17px"><strong>Don't force the clock:</strong> Cooked meatballs and a whole curry can push Sunday over two hours. Choose one such cooked dish, not both, if your priority is a short Sunday routine.</div>
 ${sectionhead('Freezer labels','Write on every bag before filling.')}
 <div class="grid cols-3"><div class="label-card"><b>PROTEIN:</b> Chicken thigh<br><b>FLAVOUR:</b> Ginger soy<br><b>RAW WEIGHT:</b> 450 g<br><b>FROZEN:</b> __________<br><b>COOK TO:</b> 74°C</div><div class="label-card"><b>COMPONENT:</b> Grain blend<br><b>SERVINGS:</b> 2<br><b>COOKED:</b> __________<br><b>FROZEN:</b> __________<br><b>REHEAT TO:</b> 74°C</div><div class="label-card"><b>MEAL:</b> Chickpea curry<br><b>SERVINGS:</b> 2<br><b>COOKED:</b> __________<br><b>FROZEN:</b> __________<br><b>REHEAT TO:</b> 74°C</div></div>`}
function marinades(){return `${heading('Marinate, portion, freeze','Yes, you can marinate raw meat and freeze it. This is a cornerstone of your routine and often tastes fresher than precooking everything.')}
 <div class="grid cols-4"><div class="card stat"><div class="ico">①</div><div class="smallcap">Portion</div><p>About 400–500 g raw meat per two-person dinner, more when reserving next-day lunch.</p></div><div class="card stat"><div class="ico">②</div><div class="smallcap">Season</div><p>Mix each marinade directly in a leakproof freezer bag or food-safe container.</p></div><div class="card stat"><div class="ico">③</div><div class="smallcap">Freeze</div><p>Flatten and freeze promptly; label protein, flavour, weight and date.</p></div><div class="card stat"><div class="ico">④</div><div class="smallcap">Thaw + cook</div><p>Thaw in fridge on the bottom shelf; cook fresh to safe internal temperature.</p></div></div>
 ${sectionhead('Six marinade formulas','Each formula seasons approximately 450–500 g of protein.')}
 <div class="grid cols-2">${marinade.map(m=>`<div class="marinade"><div class="symbol">${m.emoji}</div><div><h3>${m.name}</h3><p>${m.ingredients}</p><small><b>Best for:</b> ${m.for}. ${m.note}</small></div></div>`).join('')}</div>
 ${sectionhead('The rolling freezer system','Keep 4–6 dinner-size packs in rotation; use oldest suitable packs first.')}
 <div class="callout"><strong>Week 1:</strong> Make 2–3 freezer packs, not 8. As you discover favourites, maintain a small reserve. Freeze proteins fresh, before they reach the end of their fridge window. For quality, date packs and aim to rotate them within about 2–3 months, sooner for fatty fish.</div>
 ${sectionhead('Freezer inventory / notes','Track what is actually in your freezer; notes stay on this browser only.')}
 <textarea class="note-area" id="freezerNotes" placeholder="Example: 2 × adobo chicken (450 g), frozen Oct 25; 1 × ginger soy chicken, frozen Oct 25…">${esc(state.notes.freezer||'')}</textarea>
 <div class="callout gold" style="margin-top:17px"><strong>Safety:</strong> Always marinate in the fridge, never on the counter. Never pour uncooked raw-meat marinade on finished food. Set a separate clean sauce aside beforehand, or thoroughly boil any marinade used as a cooking sauce. For especially acidic marinades, add fresh citrus close to cooking for the best texture.</div>`}
function recipeCard(r,expanded=false){return `<article class="recipe-card" id="recipe-${r.id}"><div class="recipe-top"><span class="recipe-emoji">${r.emoji}</span><span class="timetag">◷ ${r.time}</span></div><div class="recipe-info"><h3>${r.name}</h3><p>${r.type} · ${r.servings}</p><div class="recipe-detail ${expanded?'':'hide'}" id="detail-${r.id}"><strong>Ingredients</strong><div>${r.ingredients}</div><strong>Method</strong><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div><button class="btn btn-outline" data-toggle-recipe="${r.id}" aria-expanded="${expanded}">${expanded?'Hide method ↑':'View method →'}</button></div></article>`}
function recipesPage(){const types=['All','Chicken','Turkey','Fish','Tofu','Beef','Legumes'];const list=recipes.filter(r=>(state.recipeFilter==='All'||r.type===state.recipeFilter)&&`${r.name} ${r.ingredients} ${r.type}`.toLowerCase().includes(state.search.toLowerCase()));return `${heading('Recipe book','Every planned dinner has a quick, two-person recipe. Open an individual recipe to see ingredients and cooking steps.')}
 <div class="flexrow no-print" style="align-items:start;flex-wrap:wrap;margin-bottom:18px"><div class="tabs-inline">${types.map(x=>`<button data-type="${x}" class="pill ${state.recipeFilter===x?'active':''}">${x}</button>`).join('')}</div><input id="recipeSearch" class="filter-input" aria-label="Search recipes" placeholder="Search recipes…" value="${esc(state.search)}"></div>
 <div class="grid cols-3" id="recipesGrid">${list.map(r=>recipeCard(r,r.id===state.notes.openRecipe)).join('')}</div>${list.length?'':'<div class="card" style="margin-top:16px">No recipes match that search.</div>'}
 ${sectionhead('Ninja frozen vegetable cheat sheet','Air fry frozen florets without thawing.')}
 <div class="grid cols-3"><div class="card"><div class="smallcap">Broccoli</div><h3>200°C · 12–16 min</h3><p>Start with 300–400 g. Shake midway; check tenderness.</p></div><div class="card"><div class="smallcap">Cauliflower</div><h3>200°C · 15–20 min</h3><p>Single layer for browning. Larger pieces may take longer.</p></div><div class="card"><div class="smallcap">Edamame</div><h3>Follow package</h3><p>Usually easiest to boil or steam; add to bowls after cooking.</p></div></div><p class="notice" style="margin-top:15px">Air-fryer timing is approximate and varies with Ninja model and basket size. Follow the package instructions for frozen products. A single basket used for both meat and vegetables in sequence will increase total dinner time.</p>`}
function safety(){return `${heading('Food safety & storage','A practical reference for handling Sunday batches, rice, marinated meat and quick weekday cooking. Canadian guidance governs all temperature targets below.')}
 <div class="grid cols-4"><div class="card stat"><div class="ico">🌡️</div><div class="big">≤4°C</div><div class="meta">Refrigerator temperature</div></div><div class="card stat"><div class="ico">❄</div><div class="big">−18°C</div><div class="meta">Freezer temperature</div></div><div class="card stat"><div class="ico">🍗</div><div class="big">74°C</div><div class="meta">Chicken / ground poultry internal temperature</div></div><div class="card stat"><div class="ico">♨</div><div class="big">74°C</div><div class="meta">Reheated leftovers internal temperature</div></div></div>
 ${sectionhead('Essential handling rules','These take precedence over the suggested menu order and cooking times.')}
 <div class="safety-grid"><div class="safety-item"><div class="symbol">🍚</div><b>Rice and grain blend</b><p>Cool promptly in shallow portions; refrigerate or freeze within two hours. Freeze the portions needed later in the week. Reheat thoroughly to 74°C.</p></div><div class="safety-item"><div class="symbol">🧊</div><b>Later-week meals</b><p>Use refrigerated leftovers within 2–3 days, or freeze promptly for later use. Label with cooking date. Avoid repeated heating and cooling.</p></div><div class="safety-item"><div class="symbol">🍗</div><b>Raw marinated meat</b><p>Marinate in the refrigerator. Freeze promptly in sealed bags. Thaw on a tray on the bottom fridge shelf and separate raw from cooked food.</p></div><div class="safety-item"><div class="symbol">🥣</div><b>Raw-contact marinades</b><p>Never reuse as an uncooked sauce. Reserve a clean sauce before adding raw meat, or thoroughly boil marinade used during cooking.</p></div><div class="safety-item"><div class="symbol">🐟</div><b>Fish and other proteins</b><p>Fish: 70°C. Ground beef: 71°C. Chicken and ground poultry: 74°C. Check the thickest part with a digital thermometer.</p></div><div class="safety-item"><div class="symbol">🥗</div><b>Lunches and produce</b><p>Refrigerate cut vegetables, keep cold lunches chilled with ice packs, and wash produce. Store raw meat in leakproof containers below ready-to-eat foods.</p></div></div>
 <div class="callout gold" style="margin-top:19px"><strong>Special consideration for the Ninja:</strong> A browned exterior is not proof that chicken is safely cooked. Always verify 74°C internally. Use the manufacturer's manual for your exact model, and never overcrowd the basket if you want roasted rather than steamed frozen vegetables.</div>
 ${sectionhead('Health Canada sources','Open the original guidance for more detailed storage and cooking rules.')}
 <div class="card"><div class="grid cols-2">${safelinks.map(([name,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">↗ ${name}</a>`).join('')}</div></div>`}
function footer(){return `<footer class="footer">THE SELIBIO TABLE · A personal home-kitchen planning tool · Prepared October 2026.<br>Recipes and quantities are flexible estimates; tailor for appetite, allergies and dietary requirements. Check original food-safety guidance when in doubt.<br><span class="no-print">This is a self-contained offline webpage. Your week selection, shopping checkboxes, prep checklist and notes are saved locally in this browser, not synced to other devices.</span></footer>`}
function render(){document.getElementById('nav').innerHTML=sections.map(([id,name,icon])=>`<button class="${state.page===id?'active':''}" data-go="${id}" aria-current="${state.page===id?'page':'false'}"><span class="ni">${icon}</span><span>${name}</span></button>`).join('');document.getElementById('topTitle').textContent=sections.find(x=>x[0]===state.page)?.[1]||'Meal Prep';document.getElementById('topWeek').textContent=`Week ${state.week+1} of 4`;
 const pages={home,menu,shopping,prep,marinades,recipes:recipesPage,safety};document.getElementById('view').innerHTML=`<div class="print-header">THE SELIBIO TABLE · Week ${state.week+1}</div>`+(pages[state.page]||home)()+footer();}
function toast(msg){let box=document.getElementById('toast');if(!box){box=document.createElement('div');box.id='toast';box.style.cssText='position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#163d32;color:#fff;padding:11px 18px;border-radius:12px;font-size:12px;box-shadow:0 10px 25px #0003;z-index:50;';document.body.appendChild(box)}box.textContent=msg;box.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>box.style.display='none',2300)}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy unavailable in this browser')}t.remove()}
function shopText(){let out=`THE SELIBIO TABLE — WEEK ${state.week+1}: ${currentWeek().title}\n\n`;const gs={};allShopping().forEach(x=>(gs[x.cat]??=[]).push(x));for(const [cat,items] of Object.entries(gs)){out+=cat.toUpperCase()+'\n'+items.map(x=>`[ ] ${x.name} — ${x.qty}`).join('\n')+'\n\n'}return out}
function handleClick(e){const b=e.target.closest('[data-go],[data-week],[data-action],[data-recipe],[data-toggle-recipe],[data-type]');if(!b)return;if(b.dataset.go){setPage(b.dataset.go);return}if(b.dataset.week!==undefined){setWeek(Number(b.dataset.week));return}if(b.dataset.type){state.recipeFilter=b.dataset.type;save();render();return}if(b.dataset.recipe){state.notes.openRecipe=b.dataset.recipe;state.recipeFilter='All';state.search='';setPage('recipes');setTimeout(()=>document.getElementById(`recipe-${b.dataset.recipe}`)?.scrollIntoView({behavior:'smooth',block:'center'}),30);return}if(b.dataset.toggleRecipe){const id=b.dataset.toggleRecipe;state.notes.openRecipe=state.notes.openRecipe===id?'':id;save();const box=document.getElementById(`detail-${id}`);box?.classList.toggle('hide');b.textContent=box?.classList.contains('hide')?'View method →':'Hide method ↑';b.setAttribute('aria-expanded',box?.classList.contains('hide')?'false':'true');return}if(b.dataset.action){const a=b.dataset.action;if(a==='copy-shop')copyText(shopText());if(a==='print')window.print();if(a==='reset-shop'){Object.keys(state.checked).filter(k=>k.startsWith(`shop-${state.week}-`)).forEach(k=>delete state.checked[k]);save();render()}if(a==='reset-prep'){Object.keys(state.checked).filter(k=>k.startsWith(`prep-${state.week}-`)).forEach(k=>delete state.checked[k]);save();render()}return}}
function handleChange(e){const t=e.target;if(t.dataset.check){toggleCheck(t.dataset.check,Number(t.dataset.index))}}
document.getElementById('view').addEventListener('click',handleClick);document.getElementById('nav').addEventListener('click',handleClick);document.getElementById('view').addEventListener('change',handleChange);
document.getElementById('view').addEventListener('input',e=>{if(e.target.id==='freezerNotes'){state.notes.freezer=e.target.value;save()}if(e.target.id==='recipeSearch'){const pos=e.target.selectionStart;state.search=e.target.value;save();const filtered=recipes.filter(r=>(state.recipeFilter==='All'||r.type===state.recipeFilter)&&`${r.name} ${r.ingredients} ${r.type}`.toLowerCase().includes(state.search.toLowerCase()));document.getElementById('recipesGrid').innerHTML=filtered.map(r=>recipeCard(r,r.id===state.notes.openRecipe)).join('');e.target.setSelectionRange(pos,pos)}});
document.getElementById('mobileMenu').addEventListener('click',()=>{const x=document.getElementById('navwrap');x.classList.toggle('open');document.getElementById('mobileMenu').setAttribute('aria-expanded',String(x.classList.contains('open')))});
document.getElementById('backtop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));document.getElementById('printBtn').addEventListener('click',()=>window.print());
render();
</script>
</body></html>
